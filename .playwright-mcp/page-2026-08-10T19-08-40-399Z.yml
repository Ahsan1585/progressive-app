              - main [ref=f18e21]:
                - generic [ref=f18e268]:
                  - paragraph [ref=f18e269]: How it works
                  - heading "From a session on a phone to a finished invoice" [level=1] [ref=f18e270]
                  - paragraph [ref=f18e271]: EI Simplified follows one continuous path. Practitioners log in the field, the platform validates and routes exceptions, and finished billing documents come out the other end.
                - list [ref=f18e274]:
                  - listitem [ref=f18e275]:
                    - generic [ref=f18e276]: "1"
                    - heading "Practitioner logs the session on their phone" [level=2] [ref=f18e277]
                    - paragraph [ref=f18e278]: Client, service, date, start and end time — captured in the field with a running total-time calculation and parent plus practitioner signatures.
                    - paragraph [ref=f18e279]: Quick. Easy. Done.
                  - listitem [ref=f18e280]:
                    - generic [ref=f18e281]: "2"
                    - heading "The system validates automatically" [level=2] [ref=f18e282]
                    - paragraph [ref=f18e283]: Required fields, service codes, signatures, time rules, and duplicate logs are all checked the moment the session is submitted.
                    - paragraph [ref=f18e284]: Built-in smart validations.
                  - listitem [ref=f18e285]:
                    - generic [ref=f18e286]: "3"
                    - heading "If errors are found, they're returned in the platform" [level=2] [ref=f18e287]
                    - paragraph [ref=f18e288]: Missing signature, invalid service code, incorrect end time — the practitioner sees exactly what to fix, right where they work.
                    - paragraph [ref=f18e289]: Instant return. No emails. No calls.
                  - listitem [ref=f18e290]:
                    - generic [ref=f18e291]: "4"
                    - heading "The practitioner corrects instantly" [level=2] [ref=f18e292]
                    - paragraph [ref=f18e293]: Open the returned log, fix the flagged field, re-sign if needed, and resubmit — usually in under a minute.
                    - paragraph [ref=f18e294]: Correct in seconds and resubmit.
                  - listitem [ref=f18e295]:
                    - generic [ref=f18e296]: "5"
                    - heading "All logs are error-free" [level=2] [ref=f18e297]
                    - paragraph [ref=f18e298]: Clean logs are auto-approved. Your billing team never touches a session that had nothing wrong with it.
                    - paragraph [ref=f18e299]: 100% clean logs. Ready to go.
                  - listitem [ref=f18e300]:
                    - generic [ref=f18e301]: "6"
                    - heading "SEVF and invoice are generated automatically" [level=2] [ref=f18e302]
                    - paragraph [ref=f18e303]: Units, rates, totals, and the state-mandated service verification form are produced from the approved logs — no re-keying, no spreadsheets.
                    - paragraph [ref=f18e304]: Total time and amount calculated automatically.
                - generic [ref=f18e307]:
                  - generic [ref=f18e308]:
                    - paragraph [ref=f18e309]: Exception-based review
                    - heading "Your billing team only sees what's actually broken" [level=2] [ref=f18e310]
                    - paragraph [ref=f18e311]: Traditional early intervention billing means reviewing every single log to find the handful that are wrong. EI Simplified inverts that. Clean logs approve themselves. Flagged logs are returned to the practitioner inside the platform, with a comment, and come back corrected. Nothing sits in an inbox waiting for a reply.
                    - paragraph [ref=f18e312]: The result is a review queue that shrinks to exceptions only — and a billing cycle that closes in a fraction of the time.
                  - generic [ref=f18e313]:
                    - generic [ref=f18e314]:
                      - heading "SEVF, generated for you" [level=3] [ref=f18e318]
                      - paragraph [ref=f18e319]: Provider, NPI, service month, and every code, unit, rate, and amount are filled in from the approved logs and signed off — ready for submission.
                    - generic [ref=f18e320]:
                      - heading "Invoices, calculated to the cent" [level=3] [ref=f18e324]
                      - paragraph [ref=f18e325]: Invoice number, issue and due date, line items, and total amount are produced from the same source data — so the form and the invoice can never disagree.
                - generic [ref=f18e328]:
                  - generic [ref=f18e329]:
                    - heading "See it with your own logs" [level=2] [ref=f18e330]
                    - paragraph [ref=f18e331]: We'll walk your team through the full flow in about 30 minutes.
                  - link "Schedule a demo" [ref=f18e332] [cursor=pointer]:
